name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-pie:
    name: linux / pie / php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: pie
          coverage: none
      - name: Install libhunspell
        run: sudo apt-get update && sudo apt-get install -y libhunspell-dev pkg-config
      - name: PIE install (from local path repository)
        run: |
          pie repository:add path "$(pwd)"
          pie install codeconjure/php-hunspell:@dev
      - name: Verify extension loaded
        run: php -m | grep -i hunspell
      - name: Run phpt
        run: php run-tests.php -q tests/

  linux-phpize:
    name: linux / phpize / php 8.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install libhunspell
        run: sudo apt-get update && sudo apt-get install -y libhunspell-dev pkg-config
      - name: Build
        run: |
          phpize
          ./configure --enable-hunspell
          make -j4
      - name: Run phpt
        run: NO_INTERACTION=1 make test

  linux-zts:
    name: linux / phpize / php 8.3 ZTS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
        env:
          phpts: zts
      - name: Install libhunspell
        run: sudo apt-get update && sudo apt-get install -y libhunspell-dev pkg-config
      - name: Build
        run: |
          phpize
          ./configure --enable-hunspell
          make -j4
      - name: Run phpt
        run: NO_INTERACTION=1 make test

  macos:
    name: macos / pie / php 8.3
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: pie
          coverage: none
      - name: Install libhunspell
        run: brew install hunspell pkg-config
      - name: PIE install (from local path repository)
        run: |
          pie repository:add path "$(pwd)"
          pie install codeconjure/php-hunspell:@dev
      - name: Verify extension loaded
        run: php -m | grep -i hunspell
      - name: Run phpt
        run: php run-tests.php -q tests/

  asan:
    name: linux / asan / php 8.3-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
        env:
          phpts: nts
      - name: Install libhunspell
        run: sudo apt-get update && sudo apt-get install -y libhunspell-dev pkg-config
      - name: Build with ASAN
        run: |
          phpize
          ./configure --enable-hunspell \
            CFLAGS='-fsanitize=address -g -O0' \
            CXXFLAGS='-fsanitize=address -g -O0' \
            LDFLAGS='-fsanitize=address'
          make -j4
      - name: Run phpt under ASAN
        env:
          USE_ZEND_ALLOC: '0'
          ASAN_OPTIONS: 'detect_leaks=1:abort_on_error=0'
        run: NO_INTERACTION=1 make test
